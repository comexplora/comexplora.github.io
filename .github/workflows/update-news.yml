name: Actualizar y publicar Comexplora

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  schedule:
    - cron: '30 6,10,14,18,22 * * *'
      timezone: 'America/Argentina/Buenos_Aires'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: comexplora
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Probar las calculadoras
        run: node tests/calc.test.js

      - name: Instalar Pillow (imágenes para redes)
        continue-on-error: true
        run: python -m pip install --quiet pillow

      - name: Actualizar noticias desde las fuentes
        if: github.event_name != 'push'
        run: python scripts/update_news.py

      - name: Descargar fotos de archivo que falten
        continue-on-error: true
        run: python scripts/fetch_photos.py

      - name: Generar páginas, sitemaps y RSS
        run: python scripts/build_pages.py

      - name: Preparar aviso a buscadores (IndexNow)
        id: indexnow
        continue-on-error: true
        run: python scripts/indexnow.py prepare

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name 'Comexplora Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .
          if git diff --cached --quiet; then
            echo 'Sin cambios para guardar.'
          else
            git commit -m "chore(news): actualización automática"
            # Si alguien publicó mientras corría el bot (por ejemplo, una nota curada), sus cambios ganan:
            # ante un conflicto se descarta lo del bot, se regeneran las páginas sobre lo publicado y se reintenta.
            pushed=false
            for i in 1 2 3; do
              if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then pushed=true; break; fi
              git rebase --abort 2>/dev/null || true
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              python scripts/build_pages.py
              git add -A .
              git diff --cached --quiet && { pushed=true; break; }
              git commit -m "chore(news): páginas regeneradas"
              sleep 5
            done
            if [ "$pushed" != true ]; then echo '::error::No se pudieron guardar los cambios en el repositorio.'; exit 1; fi
          fi

      - name: Armar la carpeta del sitio
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'scripts' \
                   --exclude 'templates' --exclude '*.md' --exclude 'sources.json' \
                   --exclude 'data/sources-status.json' --exclude 'data/indexnow-state.json' ./ _site/
          touch _site/.nojekyll

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Avisa a Bing y a los demás buscadores de IndexNow las páginas nuevas o modificadas, recién publicadas.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow != ''
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Avisar a buscadores
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          printf '%s' "$PAYLOAD" > payload.json
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' \
                 --data-binary @payload.json https://api.indexnow.org/indexnow)
          echo "IndexNow respondió $code"; cat resp.txt || true
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow respondió $code";; esac
